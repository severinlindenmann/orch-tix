# /etc/fail2ban/filter.d/fileshare.conf
#
# Matches the auth-failure line fileshare logs (fileshare/security.py):
#   auth: failed attempt 3/10 from 203.0.113.9
#
# The app's own counter returns 429 after 10 failures per IP in 5 minutes; this
# jail is the layer below it, dropping a persistent source at the firewall.
[Definition]
# The systemd backend hands the filter the *rendered* journal line:
#   2026-09-24T03:15:00+02:00 vps-1 uv[4242]: auth: failed attempt 1/10 from 1.2.3.4
# Anchoring with ^ matched nothing at all on the old deployment while the jail
# reported zero failures. Match the distinctive substring wherever it appears.
failregex = (?:^|\s)auth: failed attempt \d+/\d+ from <HOST>(?:\s|$)
# fileshare.deps.client_ip() yields a valid IP or the literal "unknown" (no usable
# X-Real-IP and no peer). "unknown" is not bannable; skip it so fail2ban does not
# try to resolve it as a hostname.
ignoreregex = auth: failed attempt \d+/\d+ from unknown(?:\s|$)
journalmatch = _SYSTEMD_UNIT=fileshare.service
